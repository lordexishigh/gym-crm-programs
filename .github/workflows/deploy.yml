name: Deploy

# Deploys the app from main and runs DB migrations against the production
# (Supabase, EU) database before the new build goes live. Requires these
# repository secrets to be configured (never stored in source):
#   DATABASE_URL    - Supabase Postgres connection string (EU region)
#   VERCEL_TOKEN    - Vercel deploy token
#   VERCEL_ORG_ID   - Vercel org id
#   VERCEL_PROJECT_ID - Vercel project id
#
# The production connection string is `DATABASE_URL`, not `PRODUCTION_DATABASE_URL`.
# The name matters: it is the one the provisioner writes to .env.local and can
# therefore mirror into this repo's Actions secrets by itself. Under the old name
# nothing on either side could ever supply it — the provisioner has no value under
# that key and never will — so every Deploy run failed the gate below, eight in a
# row, and the escalation repeated daily with no way to act on it. There is only
# one database for this project; the "PRODUCTION_" prefix distinguished it from
# nothing. The `test` job's own DATABASE_URL is a job-level literal pointing at a
# throwaway service container and never reads this secret.

on:
  push:
    # The repository's default branch is `master`; `main` is kept for forks/renames.
    # If this only lists a branch the repo never pushes to, the production migration
    # step below never runs and the live schema silently falls behind the code.
    branches: [master, main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

# Neither job here needs a local production build: the `test` job type-checks,
# migrates and runs the suite, and `migrate-and-deploy` migrates and hands the
# build to Vercel. Without this, `npm ci` would spend ~67s in `postinstall`
# (scripts/postinstall.mjs) producing a build that nothing in this workflow uses.
env:
  ALPHA_SKIP_BUILD: "1"

jobs:
  # Gate: the full type-check + migration + test suite (including the
  # comprehensive RLS / cross-tenant / cross-member isolation audit) must pass
  # against a fresh Postgres before anything is deployed. Isolation is a hard,
  # by-construction requirement, so a red suite must block the release — not
  # merely fail an unrelated CI run. `migrate-and-deploy` depends on this job.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_crm
      # Public build-time placeholders (mirrors CI). Tokens are verified against
      # the project JWKS at runtime; the identity unit test stubs that endpoint.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run migrations (fresh database)
        run: npm run migrate
      - name: Test (RLS isolation audit + schema + unit tests)
        run: npm test

  migrate-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast, and by NAME, when a deploy secret is missing.
      #
      # Without this the job still fails, but far downstream and with an error
      # that describes a symptom rather than the cause: an unset
      # DATABASE_URL reaches the migrate step as an EMPTY string, so
      # the runner reports "No connection string: set MIGRATE_DATABASE_URL or
      # DATABASE_URL" — which reads like a bug in the migration script rather
      # than an unconfigured repository secret. Every Deploy run failed that way
      # for weeks while the code looked fine, so the live app silently froze
      # while `master` moved on. Naming the missing secret up front makes the
      # remedy obvious and keeps a config gap from masquerading as a code defect.
      - name: Check deploy secrets are configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=""
          for name in DATABASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then missing="$missing  - $name\n"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy secrets missing::Production deploy is not configured."
            printf "Missing repository secret(s):\n%b" "$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "Until then the live app stays on its last successful deploy."
            exit 1
          fi
          echo "All four deploy secrets are present."

      # Migrations run automatically on every deploy. Idempotent: applies only
      # new migrations, so it is safe against an existing production database.
      - name: Run database migrations (production)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # scripts/migrate.mjs refuses a non-local target unless this is set. This is the
          # one place production is supposed to be migrated, so this is the one place that
          # says so out loud.
          ALLOW_REMOTE_MIGRATE: "1"
        run: npm run migrate

      # Single deploy path: Vercel Git auto-deploy is disabled for BOTH release
      # branches (vercel.json git.deploymentEnabled.master/main = false) so only
      # this CLI step deploys, guaranteeing the migration above runs before the
      # build goes live. `master` is listed explicitly because it is this repo's
      # actual default branch — disabling only `main` left the real release
      # branch free to auto-deploy straight past the migration gate.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
