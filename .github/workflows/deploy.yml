name: Deploy

# Deploys the app from main and runs DB migrations against the production
# (Supabase, EU) database before the new build goes live. Requires these
# repository secrets to be configured (never stored in source):
#   PRODUCTION_DATABASE_URL  - Supabase Postgres connection string (EU region)
#   VERCEL_TOKEN             - Vercel deploy token
#   VERCEL_ORG_ID            - Vercel org id
#   VERCEL_PROJECT_ID        - Vercel project id

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Gate: the full type-check + migration + test suite (including the
  # comprehensive RLS / cross-tenant / cross-member isolation audit) must pass
  # against a fresh Postgres before anything is deployed. Isolation is a hard,
  # by-construction requirement, so a red suite must block the release — not
  # merely fail an unrelated CI run. `migrate-and-deploy` depends on this job.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_crm
      # Public build-time placeholders (mirrors CI). Tokens are verified against
      # the project JWKS at runtime; the identity unit test stubs that endpoint.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Run migrations (fresh database)
        run: npm run migrate
      - name: Test (RLS isolation audit + schema + unit tests)
        run: npm test

  migrate-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Migrations run automatically on every deploy. Idempotent: applies only
      # new migrations, so it is safe against an existing production database.
      - name: Run database migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run migrate

      # Single deploy path: Vercel Git auto-deploy is disabled
      # (vercel.json git.deploymentEnabled.main = false) so only this CLI step
      # deploys, guaranteeing the migration above runs before the build goes live.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
