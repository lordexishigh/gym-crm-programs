name: CI

on:
  push:
    # The repository's default branch is `master`; `main` is kept for forks/renames.
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_crm
      # Build-time auth endpoint. Next.js inlines NEXT_PUBLIC_* at build time,
      # so this points at the local GoTrue stand-in (e2e/auth-stub.mjs) that the
      # Playwright journey test starts — the SAME build is then used for both
      # the smoke probe and the e2e journey. No JWT secret is needed — access
      # tokens are verified against the (stub's) JWKS; the identity unit test
      # stubs that endpoint itself.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_e2e_stub

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run migrations (fresh database)
        run: npm run migrate

      - name: Run migrations again (existing database — must be idempotent)
        run: npm run migrate

      - name: Build
        run: npm run build

      - name: Test (RLS isolation smoke tests + schema checks)
        # test/setup/db-safety.ts fails (not skips) the run if DATABASE_URL is
        # missing while GITHUB_ACTIONS is set, so the DB-backed RLS suites can
        # never be silently under-verified here.
        run: npm test

      - name: Smoke test the assembled product (boot & probe)
        # Reproduces the "final product smoke test": start the BUILT app (the
        # same `.next` output produced above) and hit the three unauthenticated
        # entry points a health check would probe. Unit/integration tests can be
        # green while the assembled product fails — e.g. /api/health returns 503
        # whenever no database is reachable — so this step exercises that path.
        # It runs against the job's throwaway Postgres (DATABASE_URL above), the
        # migrations having already been applied, so /api/health resolves to 200.
        env:
          APP_BASE_URL: http://localhost:3000
          # Migrations already ran in earlier steps; don't spawn the boot-time
          # auto-migrate/seed child processes here.
          AUTO_MIGRATE: "0"
          AUTO_SEED: "0"
        run: |
          npm run start > /tmp/next-start.log 2>&1 &
          SERVER_PID=$!

          # Tear the server down COMPLETELY before the next step runs.
          # `npm run start` spawns `next start` as a CHILD process: killing the
          # npm wrapper alone orphans it, and the orphan keeps listening on 3000.
          # The Playwright step then fails to start its own server with
          # "http://localhost:3000/login is already used". So kill the children
          # too, then block until the port is genuinely released.
          stop_server() {
            pkill -P "$SERVER_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -f "next-server" 2>/dev/null || true
            for _ in $(seq 1 30); do
              if ! curl -sf -o /dev/null http://localhost:3000/ 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            echo "::warning::port 3000 still occupied after smoke-test teardown"
          }

          # Wait (up to 60s) for the server to accept connections on `/`.
          up=0
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:3000/; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::App did not become ready within 60s"
            cat /tmp/next-start.log
            stop_server
            exit 1
          fi
          fail=0
          for path in / /login /api/health; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Smoke check failed: GET $path returned $code (expected 200)"
              fail=1
            fi
          done
          stop_server
          if [ "$fail" != "0" ]; then cat /tmp/next-start.log; fi
          exit $fail

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      - name: End-to-end journey test (invite → accept → login → portal)
        # Playwright starts the GoTrue auth stand-in AND the built app itself
        # (see playwright.config.ts webServer); the journey seeds its fixtures
        # into the job's throwaway Postgres and cleans them up after.
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload rendered screenshots (every run)
        # e2e/capture.ts saves full-page PNGs of the landing page, both sign-in
        # pages, the invite-accept form, and the authenticated member portal at
        # desktop + mobile viewports. Published unconditionally so visual
        # coherence can be reviewed from real renders on any commit.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-screenshots
          path: e2e-screenshots/
          retention-days: 14
          if-no-files-found: warn

      - name: Smoke test a FRESH CLONE (`npm start` with no prebuilt .next)
        # The scenario every automated review harness actually runs, and the one
        # the steps above cannot cover because they all build first.
        #
        # `.next/` is gitignored, so a harness that clones and runs `npm start`
        # has no production build. `next start` used to exit, nothing bound the
        # port, and an unbound port BLACK-HOLES the SYN instead of refusing the
        # connection — so `/`, `/login` and `/portal/login` all "timed out" and
        # the entire product was judged unreachable. `npm start` therefore builds
        # a missing build; this step is what keeps that true.
        #
        # Runs last because it deletes `.next`, and rebuilds it as a side effect.
        env:
          APP_BASE_URL: http://localhost:3000
          AUTO_MIGRATE: "0"
          AUTO_SEED: "0"
        run: |
          rm -rf .next
          npm run start > /tmp/fresh-start.log 2>&1 &
          SERVER_PID=$!

          stop_server() {
            pkill -P "$SERVER_PID" 2>/dev/null || true
            kill "$SERVER_PID" 2>/dev/null || true
            pkill -f "next-server" 2>/dev/null || true
          }

          # Generous: this window includes a full production build, not just boot.
          up=0
          for _ in $(seq 1 300); do
            if curl -sf -o /dev/null http://localhost:3000/; then up=1; break; fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo "::error::A fresh clone never became servable: npm start must build a missing build"
            cat /tmp/fresh-start.log
            stop_server
            exit 1
          fi

          # The exact routes the review reported as dead.
          fail=0
          for path in / /login /portal/login; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$path")
            echo "GET $path -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::Fresh-clone check failed: GET $path returned $code (expected 200)"
              fail=1
            fi
          done
          stop_server
          if [ "$fail" != "0" ]; then cat /tmp/fresh-start.log; fi
          exit $fail

      - name: Verify committed tree (nothing untracked or modified)
        # CI checks out the committed tree, so every step above already ran
        # against committed code only — a file that exists on a developer's
        # disk but was never committed fails the type check/build/tests here.
        # This step closes the remaining gap: it fails if any build/test step
        # generated files that are neither committed nor gitignored, so such
        # artifacts can't silently accumulate as "works locally" state.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after build & tests — commit or gitignore the files below:"
            git status --porcelain
            exit 1
          fi
