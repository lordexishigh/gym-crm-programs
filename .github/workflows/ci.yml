name: CI

on:
  push:
    # The repository's default branch is `master`; `main` is kept for forks/renames.
    branches: [master, main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alpha_crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/alpha_crm
      # Public build-time placeholders. No JWT secret is needed — access tokens
      # are verified against the project's JWKS at runtime; the identity unit
      # test stubs that endpoint.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run migrations (fresh database)
        run: npm run migrate

      - name: Run migrations again (existing database — must be idempotent)
        run: npm run migrate

      - name: Build
        run: npm run build

      - name: Test (RLS isolation smoke tests + schema checks)
        run: npm test
