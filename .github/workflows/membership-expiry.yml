name: Membership expiry reminders

# Daily scheduled job (market gap #7): email members whose subscription
# renews within 7 days. No in-process cron exists in a serverless Next.js
# deployment, so this runs the standalone script on a schedule instead.
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC daily
  workflow_dispatch: {} # allow a manual run from the Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send membership-expiry reminders
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INVITE_FROM_EMAIL: ${{ secrets.INVITE_FROM_EMAIL }}
        run: node scripts/notify-membership-expiry.mjs
